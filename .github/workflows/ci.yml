name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      # requirements.lock carries its own --extra-index-url for the CPU-only torch
      # wheels, so this install never pulls a multi-gigabyte CUDA build.
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: aeris-benchmark --seed 7 --trials 1 --output artifacts/benchmark-smoke.json
