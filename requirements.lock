# Pinned runtime/test set, regenerated 2026-08-20 in a clean virtualenv
# (C:\Users\hp\AppData\Local\Temp\aeris_cleanroom_venv — created from
# `python -m venv`, never mixed with the developer's warm environment).
#
# Regenerate with:
#   python -m venv .venv-clean
#   .venv-clean\Scripts\python -m pip install --upgrade pip
#   .venv-clean\Scripts\python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
#   .venv-clean\Scripts\python -m pip freeze | findstr /v "aeris-drone-safety" > requirements.lock
#
# The --extra-index-url pins CPU-only torch/torchvision wheels so a judge's machine
# does not pull a multi-gigabyte CUDA build. This line must be present on install.
#
# opencv-python is deliberately absent: it and opencv-python-headless both install the
# same `cv2` module and clobber each other, and the non-headless build needs libGL,
# which the slim container image does not carry.
--extra-index-url https://download.pytorch.org/whl/cpu

