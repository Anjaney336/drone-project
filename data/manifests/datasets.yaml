datasets:
  - name: aeris-simulation-v2
    source: aeris.simulation.scenarios
    license: repository license
    modality: kinematic truth and GNSS-like position measurements
    purpose: controlled state-estimation and trajectory validation
    number_of_samples: generated per configuration
    labels: scenario_id
    preprocessing: none
    split: seeded scenario matrix; no train/validation/test claim
    origin: simulation
    real_or_synthetic: synthetic simulation
    known_limitations: simplified dynamics and observation models; no calibrated vehicle or environment model
  - name: aeris-fault-injection-v2
    source: aeris.simulation.fault_injection
    license: repository license
    modality: perturbed navigation and timing measurements
    purpose: controlled resilience and anomaly-detection evaluation
    number_of_samples: generated per configuration
    labels: gnss_drift, gnss_dropout, imu_bias, camera_degradation, camera_occlusion, packet_loss, communication_latency, sensor_disagreement, combined_degradation
    preprocessing: faults have explicit severity, start time, duration, affected sensor, and recovery phase
    split: scenario controlled
    origin: synthetic_fault
    real_or_synthetic: synthetic fault injection
    known_limitations: not a real-world attack or fault measurement dataset
